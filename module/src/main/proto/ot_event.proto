syntax = "proto3";

package com.example.ignition.zerobus.proto;

option java_package = "com.example.ignition.zerobus.proto";
option java_outer_classname = "OTEventProto";
option java_multiple_files = true;

/**
 * OTEvent - Operational Technology event message for Zerobus Ingest.
 *
 * This protobuf schema MUST match the Delta table (catalog.schema.raw_tags) exactly:
 * column names, types, and order. See module/SCHEMA_ALIGNMENT.md.
 *
 * IMPORTANT: All value fields use the `optional` keyword so that proto3 serializes
 * them even at default values (0, 0.0, false, ""). Without `optional`, proto3 omits
 * default-valued fields from the wire and Zerobus Ingest maps them to NULL in Delta
 * instead of the actual value. See: https://protobuf.dev/programming-guides/proto3/#field-labels
 */
message OTEvent {
  // Unique event identifier
  string event_id = 1;
  
  // Event timestamp (microseconds since Unix epoch). Maps to Delta BIGINT.
  int64 event_time = 2;
  
  // Full Ignition tag path (e.g., "[default]TestSimulator/Sine0")
  string tag_path = 3;
  
  // Ignition tag provider name (e.g., "default")
  string tag_provider = 4;
  
  // Numeric tag value (for numeric tags); 0.0 when not applicable.
  // `optional` ensures a legitimate 0.0 reading is not mapped to NULL by Zerobus.
  optional double numeric_value = 5;
  
  // String tag value (for string tags); empty when not applicable.
  optional string string_value = 6;
  
  // Boolean tag value (for boolean tags); false when not applicable.
  optional bool boolean_value = 7;
  
  // Quality indicator as string ("GOOD", "BAD", "UNCERTAIN")
  optional string quality = 8;
  
  // Numeric quality code from Ignition
  optional int32 quality_code = 9;
  
  // Source Ignition Gateway identifier
  string source_system = 10;
  
  // Ingestion timestamp (microseconds since Unix epoch). Maps to Delta BIGINT.
  int64 ingestion_timestamp = 11;
  
  // Original data type from Ignition tag
  string data_type = 12;
  
  // Alarm state if tag is in alarm (empty string when no alarm)
  optional string alarm_state = 13;
  
  // Alarm priority if applicable (0 when no alarm)
  optional int32 alarm_priority = 14;

  // Whether this event was emitted by the SDT path (survived or passthrough)
  optional bool sdt_compressed = 15;

  // Running compression ratio at emission time (e.g., 3.2 = 3.2:1). 0 when SDT off.
  optional double compression_ratio = 16;

  // Gateway config: SDT compression was enabled when this event was sent (authoritative on/off).
  optional bool sdt_enabled = 17;

  // Size in bytes of the batch this event was sent in (sum of serialized event sizes). Demo observability.
  optional int64 batch_bytes_sent = 18;
}

